name: Northwind OMS Smart Build

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all

jobs:
  build:
    runs-on: ubuntu-latest

    # defaults:
    #   run:
    #     working-directory: osgi-workshop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Make build script executable
        run: chmod +x buildapp.py

      - name: Verify workspace
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "POM locations:"
          find . -name pom.xml -print

          echo ""
          echo "buildapp.py locations:"
          find . -name buildapp.py -print

      - name: Run Smart Build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python buildapp.py --mode "${{ inputs.build_mode }}" --build
          else
            python buildapp.py --mode all --build
          fi

      - name: Debug Maven outputs
        if: always()
        run: |
          echo "========================================"
          echo "TARGET DIRECTORIES"
          echo "========================================"
          find . -type d -name target -print

          echo ""
          echo "========================================"
          echo "ALL FILES INSIDE TARGET DIRECTORIES"
          echo "========================================"
          find . -type f -path "*/target/*" -print

          echo ""
          echo "========================================"
          echo "JAR / ZIP FILES"
          echo "========================================"
          find . -type f \
            \( -name "*.jar" -o -name "*.zip" -o -name "*.war" -o -name "*.ear" \) \
            -path "*/target/*" \
            -print

      - name: Add artifacts to job summary
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Build Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          mapfile -t ARTIFACTS < <(
            find . -type f \
              \( -name "*.jar" -o -name "*.zip" -o -name "*.war" -o -name "*.ear" \) \
              -path "*/target/*" \
              -print | sort
          )

          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then
            echo "No build artifacts found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Artifact | Size |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"

            for file in "${ARTIFACTS[@]}"; do
              size=$(du -h "$file" | cut -f1)
              echo "| \`$file\` | $size |" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"