name: Northwind OMS Smart Build

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: osgi-workshop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Make build script executable
        run: chmod +x buildapp.py

      - name: Verify workspace
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "POM locations:"
          find . -name pom.xml -print

          echo ""
          echo "buildapp.py locations:"
          find . -name buildapp.py -print

      - name: Run Smart Build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python buildapp.py --mode "${{ inputs.build_mode }}" --build
          else
            python buildapp.py --mode all --build
          fi

      - name: Debug Maven outputs
        if: always()
        run: |
          echo "========================================"
          echo "TARGET DIRECTORIES"
          echo "========================================"
          find . -type d -name target -print

          echo ""
          echo "========================================"
          echo "ALL FILES INSIDE TARGET DIRECTORIES"
          echo "========================================"
          find . -type f -path "*/target/*" -print

          echo ""
          echo "========================================"
          echo "JAR / ZIP FILES"
          echo "========================================"
          find . -type f \( -name "*.jar" -o -name "*.zip" \) -print

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northwind-oms-artifacts
          path: |
            **/target/*.jar
            **/target/*.zip
          if-no-files-found: warn