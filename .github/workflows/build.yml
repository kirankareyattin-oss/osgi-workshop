name: Northwind OMS Smart Build

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Make build script executable
        run: chmod +x buildapp.py

      - name: Verify workspace
        run: |
          echo "========================================"
          echo "WORKSPACE"
          echo "========================================"
          pwd
          ls -la

          echo ""
          echo "========================================"
          echo "POM FILES"
          echo "========================================"
          find . -name pom.xml -print

          echo ""
          echo "========================================"
          echo "BUILD SCRIPT"
          echo "========================================"
          find . -name buildapp.py -print

      - name: Run Smart Build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python buildapp.py \
              --mode "${{ inputs.build_mode }}" \
              --build
          else
            python buildapp.py \
              --mode all \
              --build
          fi

      - name: Debug Maven outputs
        if: always()
        run: |
          echo "========================================"
          echo "TARGET DIRECTORIES"
          echo "========================================"
          find . -type d -name target -print

          echo ""
          echo "========================================"
          echo "ALL FILES INSIDE TARGET DIRECTORIES"
          echo "========================================"
          find . -type f -path "*/target/*" -print

          echo ""
          echo "========================================"
          echo "JAR / ZIP / WAR / EAR FILES"
          echo "========================================"
          find . -type f \( \
            -name "*.jar" -o \
            -name "*.zip" -o \
            -name "*.war" -o \
            -name "*.ear" \
          \) -print

      - name: Verify build artifacts
        if: always()
        run: |
          echo "========================================"
          echo "BUILD ARTIFACT VERIFICATION"
          echo "========================================"

          ARTIFACT_COUNT=$(find . -type f \( \
            -name "*.jar" -o \
            -name "*.zip" -o \
            -name "*.war" -o \
            -name "*.ear" \
          \) | wc -l)

          echo "Artifact count: ${ARTIFACT_COUNT}"

          if [ "${ARTIFACT_COUNT}" -eq 0 ]; then
            echo "WARNING: No Maven artifacts were found."
          else
            echo "Build artifacts found:"
            find . -type f \( \
              -name "*.jar" -o \
              -name "*.zip" -o \
              -name "*.war" -o \
              -name "*.ear" \
            \) -print
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northwind-oms-artifacts
          path: |
            **/target/*.jar
            **/target/*.zip
            **/target/*.war
            **/target/*.ear
          if-no-files-found: warn
          retention-days: 7