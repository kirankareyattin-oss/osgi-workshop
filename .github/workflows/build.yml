name: Northwind OMS Smart Build

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify Java and Maven
        run: |
          echo "========================================"
          echo "JAVA VERSION"
          echo "========================================"
          java -version

          echo ""
          echo "========================================"
          echo "MAVEN VERSION"
          echo "========================================"
          mvn -version

          echo ""
          echo "MAVEN LOCATION"
          echo "========================================"
          which mvn

      - name: Verify workspace
        run: |
          echo "========================================"
          echo "WORKSPACE"
          echo "========================================"
          pwd
          ls -la

          echo ""
          echo "========================================"
          echo "POM FILES"
          echo "========================================"
          find . -name pom.xml -print

          echo ""
          echo "========================================"
          echo "BUILD SCRIPT"
          echo "========================================"
          ls -l buildapp.py

      - name: Run Smart Build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python buildapp.py \
              --mode "${{ inputs.build_mode }}" \
              --build
          else
            python buildapp.py \
              --mode all \
              --build
          fi

      - name: Debug Maven outputs
        if: always()
        run: |
          echo "========================================"
          echo "TARGET DIRECTORIES"
          echo "========================================"

          find . -type d -name target -print

          echo ""
          echo "========================================"
          echo "ALL FILES INSIDE TARGET DIRECTORIES"
          echo "========================================"

          find . -type f -path "*/target/*" -print

          echo ""
          echo "========================================"
          echo "JAR / ZIP / WAR / EAR FILES"
          echo "========================================"

          find . -type f \( \
            -name "*.jar" -o \
            -name "*.zip" -o \
            -name "*.war" -o \
            -name "*.ear" \
          \) -print

      - name: Collect Build Artifacts
        if: always()
        run: |
          echo "========================================"
          echo "COLLECTING BUILD ARTIFACTS"
          echo "========================================"

          rm -rf artifact-output
          mkdir -p artifact-output

          find . -type f \
            -path "*/target/*" \
            \( \
              -name "*.jar" -o \
              -name "*.zip" -o \
              -name "*.war" -o \
              -name "*.ear" \
            \) \
            -not -path "./.git/*" \
            -exec cp --parents {} artifact-output/ \;

          echo ""
          echo "========================================"
          echo "COLLECTED ARTIFACTS"
          echo "========================================"

          if find artifact-output -type f | grep -q .; then
            find artifact-output -type f -print
          else
            echo "No build artifacts collected."
          fi

      - name: Verify build artifacts
        if: always()
        run: |
          echo "========================================"
          echo "BUILD ARTIFACT VERIFICATION"
          echo "========================================"

          ARTIFACT_COUNT=$(find artifact-output \
            -type f \
            \( \
              -name "*.jar" -o \
              -name "*.zip" -o \
              -name "*.war" -o \
              -name "*.ear" \
            \) | wc -l)

          echo "Artifact count: ${ARTIFACT_COUNT}"

          if [ "${ARTIFACT_COUNT}" -eq 0 ]; then
            echo "WARNING: No Maven artifacts were found."
          else
            echo ""
            echo "Build artifacts found:"
            find artifact-output -type f -print
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northwind-oms-artifacts
          path: artifact-output
          if-no-files-found: warn
          retention-days: 7