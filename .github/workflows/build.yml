name: Northwind OMS Smart Build

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Make build script executable
        run: chmod +x buildapp.py

      - name: Run Smart Build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python buildapp.py --mode "${{ inputs.build_mode }}" --build
          else
            python buildapp.py --mode changed --build
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northwind-oms-artifacts
          path: |
            **/target/*.jar
            **/target/*.zip
          if-no-files-found: warn
      
      - name: Debug generated artifacts
        if: always()
        run: |
          echo "Generated JAR/ZIP files:"
          find . -type f \( -name "*.jar" -o -name "*.zip" \) -print