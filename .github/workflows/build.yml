name: Northwind OMS Smart OSGi Build

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version
          which mvn

      - name: Verify OSGi files
        run: |
          echo "OSGi MANIFEST files:"
          find . -path "./.git" -prune -o -name MANIFEST.MF -print
          echo ""
          echo "OSGi feature files:"
          find . -path "./.git" -prune -o -name feature.xml -print
          echo ""
          ls -l buildapp.py

      - name: Run Smart OSGi Build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python buildapp.py --mode "${{ inputs.build_mode }}" --build
          else
            python buildapp.py --mode changed --build
          fi

      - name: Debug Build Outputs
        if: always()
        run: |
          echo "TARGET DIRECTORIES"
          find . -path "./.git" -prune -o -type d -name target -print
          echo ""
          echo "FILES INSIDE TARGET DIRECTORIES"
          find . -path "./.git" -prune -o -type f -path "*/target/*" -print
          echo ""
          echo "OSGi BUILD ARTIFACTS"
          find . -path "./.git" -prune -o -type f \( -name "*.jar" -o -name "*.zip" -o -name "*.war" -o -name "*.ear" \) -print

      - name: Collect Build Artifacts
        if: always()
        run: |
          rm -rf artifact-output
          mkdir -p artifact-output
          find . -path "./.git" -prune -o -type f -path "*/target/*" \( -name "*.jar" -o -name "*.zip" -o -name "*.war" -o -name "*.ear" \) -exec cp --parents {} artifact-output/ \;
          echo "Collected artifacts:"
          find artifact-output -type f -print

      - name: Verify Build Artifacts
        if: always()
        run: |
          ARTIFACT_COUNT=$(find artifact-output -type f \( -name "*.jar" -o -name "*.zip" -o -name "*.war" -o -name "*.ear" \) | wc -l)
          echo "Artifact count: ${ARTIFACT_COUNT}"
          if [ "${ARTIFACT_COUNT}" -eq 0 ]; then
            echo "WARNING: No OSGi build artifacts were found."
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northwind-oms-osgi-artifacts
          path: artifact-output
          if-no-files-found: warn
          retention-days: 7